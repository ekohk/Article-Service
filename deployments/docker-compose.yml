services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: articles
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # exposed on host port 5433 to avoid conflict with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d articles"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  # ── Elasticsearch ───────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - backend

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4.3-alpine
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      HTTP_ADDR: :8080
      HTTP_READ_TIMEOUT: 5s
      HTTP_WRITE_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 60s
      POSTGRES_DSN: postgres://app:app@postgres:5432/articles?sslmode=disable
      POSTGRES_MAX_CONNS: 20
      POSTGRES_MIN_CONNS: 2
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: articles-v1
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CACHE_TTL: 45s
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_MAX_ATTEMPTS: "10"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ── Worker ───────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      POSTGRES_DSN: postgres://app:app@postgres:5432/articles?sslmode=disable
      POSTGRES_MAX_CONNS: 5
      POSTGRES_MIN_CONNS: 1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: articles-v1
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CACHE_TTL: 45s
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_MAX_ATTEMPTS: "10"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:

networks:
  backend:
    driver: bridge
