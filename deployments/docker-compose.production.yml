services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: :8080
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-20}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-2}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?ELASTICSEARCH_URL is required}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-articles-v1}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:?ELASTICSEARCH_USERNAME is required}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL: ${CACHE_TTL:-45s}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - app

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_DSN: ${POSTGRES_DSN:?POSTGRES_DSN is required}
      POSTGRES_MAX_CONNS: ${WORKER_POSTGRES_MAX_CONNS:-5}
      POSTGRES_MIN_CONNS: ${WORKER_POSTGRES_MIN_CONNS:-1}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:?ELASTICSEARCH_URL is required}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-articles-v1}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:?ELASTICSEARCH_USERNAME is required}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL: ${CACHE_TTL:-45s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
